name: Suite staging foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  identity-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, curl
          coverage: none
      - run: php -l includes/Suite/Gateway.php && php -l includes/Suite/ProjectScope.php
      - run: php tests/suite-staging.php
