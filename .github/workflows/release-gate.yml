name: release-gate

on:
  push:
    branches: [ main, project-ready-v3 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl
      - name: PHP syntax
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './includes/PhpSpreadsheet/*' \
            -not -path './tcpdf/*' \
            -print0 | xargs -0 -n1 php -l
      - name: Configuration regression
        run: |
          php tests/configuration-regression.php constants-first
          php tests/configuration-regression.php database-first
      - name: Functional regressions
        run: php tests/functional-regressions.php
      - name: Defect lifecycle regressions
        run: php tests/defect-lifecycle-regression.php
      - name: Mail safety regression
        run: php tests/site-mail.php
      - name: Service worker regression
        run: node tests/service-worker-cache.cjs

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check live login page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20             https://mcgoff.defecttracker.uk/login.php -o /tmp/login.html
          if grep -Eiq 'Fatal error|Parse error|Warning:|Uncaught (Error|Exception)' /tmp/login.html; then
            echo "Live login page contains a PHP/runtime error."
            exit 1
          fi
          if ! grep -Eiq '<form|login|sign in' /tmp/login.html; then
            echo "Live login page does not look like the expected login screen."
            exit 1
          fi
      - name: Check live application/database health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --max-time 20             https://mcgoff.defecttracker.uk/health.php)"
          echo "$body"
          php -r '
            $d = json_decode(stream_get_contents(STDIN), true);
            if (!is_array($d) || ($d["status"] ?? "") !== "ok" || ($d["database"] ?? "") !== "ok") {
                fwrite(STDERR, "Live health check failed.\n");
                exit(1);
            }
          ' <<< "$body"
